<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BON Design — Brands with impact</title>
<meta name="description" content="Portfolio de branding, packaging y diseño digital. Creativity with strategy, design with vision.">
<meta name="theme-color" content="#6f2b41">
<meta property="og:title" content="BON Design — Brands with impact">
<meta property="og:description" content="Portfolio de branding, packaging y diseño digital.">
<meta property="og:image" content="img/header.webp">
<meta property="og:type" content="website">
<link rel="preload" as="image" href="img/header.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#6f2b41;
  --label:#a3a3a3;
  --label-soft:#c2c2c2;
  --rule:#e8e8e8;
  --pad:5.5vw;
  --gap-section:6.5vw;
  --gap-rule:1vw;
  --gap-img:1.5vw;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
body{margin:0;background:#fff;color:#2b2b2b;font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
img{display:block;width:100%;height:auto;}
.hero,.footer>img{margin:0;}
.project{margin-top:var(--gap-section);padding:0 var(--pad);}
.project__head{padding-bottom:.5vw;margin-bottom:var(--gap-rule);border-bottom:1px solid var(--rule);}
.project__title{margin:0;font-size:clamp(15px,2.3vw,34px);font-weight:200;letter-spacing:.015em;line-height:1.2;color:var(--label);}
.project__label{display:block;margin-top:.35vw;font-size:clamp(8px,.8vw,12px);font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--label-soft);}
.project__media>*+*{margin-top:var(--gap-img);}
.screens{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--gap-img);}
.footer{margin-top:var(--gap-section);}
.footer__contact{padding:4vw var(--pad) 7vw;text-align:center;}
.footer__mail{display:inline-block;font-size:clamp(11px,1.05vw,14px);letter-spacing:.1em;color:var(--wine);text-decoration:none;border-bottom:1px solid rgba(111,43,65,.28);padding-bottom:3px;}
.footer__mail:hover{border-bottom-color:var(--wine);}
.reveal{opacity:1;}
a:focus-visible{outline:2px solid var(--wine);outline-offset:3px;}
@media (max-width:900px){.screens{grid-template-columns:repeat(3,1fr);}}
@media (max-width:560px){
  :root{--pad:5vw;--gap-section:9vw;--gap-img:2vw;}
  .screens{grid-template-columns:repeat(2,1fr);}
  .project__title{font-size:15px;}
  .project__label{font-size:8px;letter-spacing:.16em;}
}
</style>
</head>
<body><script>document.documentElement.className+=" js-on";</script>

<header class="hero">
  <img src="img/header.webp" alt="BON Design — creativity with strategy, design with vision, brands with impact" fetchpriority="high" decoding="async">
</header>

<main>

<section class="project reveal">
  <div class="project__head"><h2 class="project__title">PlantaBio App</h2><span class="project__label">Branding Design</span></div>
  <div class="project__media">
    <div class="screens">
      <img src="img/planta_bio_1.webp" alt="PlantaBio — splash" loading="lazy" decoding="async">
      <img src="img/planta_bio_2.webp" alt="PlantaBio — bienvenida" loading="lazy" decoding="async">
      <img src="img/planta_bio_3.webp" alt="PlantaBio — registro" loading="lazy" decoding="async">
      <img src="img/planta_bio_4.webp" alt="PlantaBio — mis plantas" loading="lazy" decoding="async">
      <img src="img/planta_bio_5.webp" alt="PlantaBio — inicio" loading="lazy" decoding="async">
      <img src="img/planta_bio_6.webp" alt="PlantaBio — detalle de planta" loading="lazy" decoding="async">
    </div>
    <img src="img/planta_bio_moodboard.webp" alt="PlantaBio — moodboard, paleta y aplicación de marca" loading="lazy" decoding="async">
  </div>
</section>

<section class="project reveal">
  <div class="project__head"><h2 class="project__title">Reencarnaciones | Monteviejo Winery</h2><span class="project__label">Art &amp; Culture</span></div>
  <div class="project__media"><img src="img/Reencarnaciones_PlusArte.webp" alt="Reencarnaciones — Monteviejo Winery, sistema gráfico y piezas de campaña" loading="lazy" decoding="async"></div>
</section>

<section class="project reveal">
  <div class="project__head"><h2 class="project__title">Builder S.A.S.</h2><span class="project__label">Branding Design</span></div>
  <div class="project__media"><img src="img/builder.webp" alt="Builder S.A.S. — logotipo, papelería y aplicaciones" loading="lazy" decoding="async"></div>
</section>

<section class="project reveal">
  <div class="project__head"><h2 class="project__title">Zygia</h2><span class="project__label">Branding Design</span></div>
  <div class="project__media"><img src="img/zygia.webp" alt="Grupo Zygia Desarrollos — identidad, patrones y aplicaciones" loading="lazy" decoding="async"></div>
</section>

<section class="project reveal">
  <div class="project__head"><h2 class="project__title">El Patio</h2><span class="project__label">Branding Design</span></div>
  <div class="project__media"><img src="img/el_patio.webp" alt="El Patio Café — identidad, packaging y piezas gráficas" loading="lazy" decoding="async"></div>
</section>

<section class="project reveal">
  <div class="project__head"><h2 class="project__title">Newtech</h2><span class="project__label">Branding Design</span></div>
  <div class="project__media"><img src="img/new_tech.webp" alt="Newtech — logotipo, variantes y aplicaciones de marca" loading="lazy" decoding="async"></div>
</section>

<section class="project reveal">
  <div class="project__head"><h2 class="project__title">Caminando entre Sombras</h2><span class="project__label">Packaging Design</span></div>
  <div class="project__media"><img src="img/entre_sombras.webp" alt="Caminando entre Sombras — botella, etiqueta y campaña" loading="lazy" decoding="async"></div>
</section>

<section class="project reveal">
  <div class="project__head"><h2 class="project__title">Bravard</h2><span class="project__label">Packaging Design</span></div>
  <div class="project__media"><img src="img/bravard.webp" alt="Bravard — cerveza artesanal, identidad y packaging de la línea" loading="lazy" decoding="async"></div>
</section>

<section class="project reveal">
  <div class="project__head"><h2 class="project__title">Wine Packaging</h2><span class="project__label">Packaging Design</span></div>
  <div class="project__media">
    <img src="img/wine_packaging_1.webp" alt="Wine packaging — Eracles y Virtus" loading="lazy" decoding="async">
    <img src="img/wine_packaging_2.webp" alt="Wine packaging — etiquetas de la línea" loading="lazy" decoding="async">
    <img src="img/wine_packaging_3.webp" alt="Wine packaging — aplicaciones" loading="lazy" decoding="async">
  </div>
</section>

</main>

<footer class="footer">
  <img src="img/footer.webp" alt="BON Design — brands with impact" loading="lazy" decoding="async">
  
</footer>

<script>
var items=document.querySelectorAll('.reveal');
if('IntersectionObserver' in window){
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target);}});
  },{rootMargin:'0px 0px -50px 0px'});
  items.forEach(function(el){io.observe(el);});
}else{
  items.forEach(function(el){el.classList.add('is-in');});
}
</script>

</body>
</html>
